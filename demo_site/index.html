<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VirtualExec</title>
    <link rel="stylesheet" href="style.css">
    <script language="javascript" type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <script language="javascript" type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/perl/perl.min.js"></script>

    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css"></link>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/material-darker.min.css"></link>

    <script type="module" src="script.js"></script>
</head>
<body>
    <div id="stop_button" class="monospace boundary right_align min hidden">Stop</div>
    <div id="run_button" class="monospace boundary right_align min">Run</div>
    <label>
        <textarea class="monospace boundary" id="editor"></textarea>
    </label>

    <div id="metrics" class="monospace">
        <span id="metric_state" class="chip">idle</span>
        <span class="metric" title="vByte">
            <span class="label">mem</span>
            <span class="bar"><span id="metric_mem_fill"></span></span>
            <span id="metric_mem" class="num">&mdash;</span>
        </span>
        <span class="metric" title="inst">
            <span class="label">inst</span>
            <span class="bar"><span id="metric_inst_fill"></span></span>
            <span id="metric_inst" class="num">&mdash;</span>
        </span>
        <span class="metric" title="obj">
            <span class="label">obj</span>
            <span id="metric_obj" class="num">&mdash;</span>
        </span>
        <span id="metric_note" class="note"></span>
    </div>

    <pre id="output" class="monospace boundary"></pre>
</body>
</html>
